[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmr-system-mapper"
version = "0.1.0"
description = "Passive DMR network topology mapper built on DSD-FME output"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "networkx>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "numpy>=1.26", "scipy>=1.11", "textual>=0.80"]
collector = ["numpy>=1.26", "scipy>=1.11"]   # SoapySDR python bindings come from the OS package
tui = ["textual>=0.80"]
mcp = ["mcp>=1.2"]

[project.scripts]
mapper = "dmr_mapper.cli:main"

[tool.setuptools.packages.find]
include = ["dmr_mapper*"]

[tool.setuptools.package-data]
"dmr_mapper.db" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
