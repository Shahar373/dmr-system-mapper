# dmr-system-mapper configuration template.
#
# Copy to config.local.yaml (git-ignored) and override only what differs on your machine.
# config.local.yaml is deep-merged on top of this file: nested keys you do not set keep
# their defaults. Paths are relative to the repository root unless absolute.

paths:
  db: var/mapper.db            # the only persistent store; tens of MB for months of data
  raw_logs: var/raw            # DSD-FME raw logs, only written when decode.keep_raw_logs is true
  exports: var/exports         # graph exports (HTML, GraphML, JSON, systems.txt)
  snapshots: var/snapshots     # nightly consistent copies of the database; the archive Pi pulls this folder

timezone: Asia/Jerusalem       # display, and the clock of DSD-FME log files given to `mapper ingest` (the capturing
                               # machine's zone). The collector reads its own decoders in the system zone; keep the
                               # Pi's zone the same (`mapper doctor` checks). The database stores UTC epoch seconds.

sdr:
  source: soapy                # soapy (real receiver) | file (replay an IQ recording, see replay below)
  driver: sdrplay              # SoapySDR driver name (SoapySDRPlay3)
  devices:                     # one RSP1B: it alternates survey sweeps and decode dwells.
    - {serial: "", role: any}  # serial from `SoapySDRUtil --find`; add a second entry with
                               # role: survey / role: decode when a second receiver exists
  sample_rate_hz: 2000000      # capture rate; must be one the driver offers (SDRplay: 2, 2.048, 3 ... MS/s, not 2.4)
  usable_fraction: 0.8         # share of the capture bandwidth used (filter roll-off at the edges)
  gain:
    ifgr: 40                   # IF gain reduction (dB)
    lna_state: 3               # RFGR / LNA state
    agc: false
  usb_vendor: "1df7"           # USB vendor id of the receiver (1df7 = SDRplay); tells "not plugged in" from "in use"
  known_users:                 # program or script names (exact) of SDR users run by OTHER Linux users,
                               # whose /proc maps we cannot read; our own user's are found by their libraries
    [trunk-recorder, SDRconnect, sdrconnect, sdrpp, gqrx, rx_fm, rx_sdr, SoapySDRServer]
  replay:                      # only for source: file
    path: ""                   # raw IQ file (cf32 or cs16 interleaved)
    format: cf32
    center_hz: 0

survey:
  bands:
    - {name: vhf-high, start_hz: 160000000, stop_hz: 174000000, raster_hz: 12500}
    - {name: uhf,      start_hz: 400000000, stop_hz: 470000000, raster_hz: 12500}
  dwell_s: 3                   # seconds per tuner step
  segment_s: 1                 # PSD integration segment inside a dwell
  snr_threshold_db: 9          # p95 channel SNR gate (same meaning as the surveyor)
  raster_tolerance_hz: 2500    # how far from the 12.5 kHz raster a hit may sit
  cycle_minutes: 30            # full survey repeat interval
  same_site_max_span_hz: 5000000   # Cap+ carriers of one site are assumed within this span
  tier3_bandplans: []          # optional: [{name, base_hz, step_hz, lpcn_offset}] for LPCN->frequency

decode:
  dsd_fme_bin: dsd-fme         # name on PATH or absolute path
  extra_args: []               # appended to the DSD-FME command line (see CAPTURE.md §2)
  max_instances: 4             # on mains power; power.battery_max_instances applies on battery
  seconds_per_carrier: 60      # decode dwell per carrier per cycle; same-site groups get double
  invert_retry_s: 10           # restart with -xr when only -DMR syncs were seen for this long
  tcp_base_port: 7355          # PCM bridge ports: base, base+1, ... per instance
  keep_raw_logs: false         # debug only
  raw_log_max_mb: 50           # rotation size cap per raw log
  raw_log_keep: 5              # rotated files kept

watch:                         # mapper watch / console key w: one slice, DSD-FME on whatever keys up (Phase 4)
  keyup_snr_db: 10             # a raster channel this far over the slice's median channel for 0.2 s has keyed up
  keydown_snr_db: 6            # ... and has keyed down after hang_s under this
  hang_s: 2.0
  min_keyup_s: 0.5             # shorter bursts are counted, not stored
  preroll_s: 0.5               # audio from before the key-up fed to the new DSD-FME (rebuilt from kept FFT blocks)
  max_hold_s: 30               # a channel decoded this long gives way when another one is waiting
  max_instances: 6             # DSD-FME at once on mains (control channels pinned: up to half of them)
  channel_width_hz: 10000      # power measured over this width around each raster channel

ingest:
  bucket_minutes: 15           # observation aggregation bucket

daemon:
  tick_s: 1                    # main loop period
  heartbeat_stale_s: 10        # clients call the daemon dead after this long without a heartbeat
  default_budget_min: 60       # session length on mains when the client gives none
  sdr_probe_interval_s: 30     # how often an idle daemon checks that the receiver is plugged in (USB only, no driver call)
  sdr_full_probe_interval_s: 600   # how often it asks the driver whether the receiver is free (always before a session)
  survey_hits_keep_days: 14    # prune survey_hits older than this at the end of a session
  correlate_after_decode: true # run the evidence engine when a decode session ends

gps:                           # the receiver's own position; read only while a session runs
  source: auto                 # auto: gpsd if it runs (shared safely), else the device if no other program has it open | gpsd | serial | none
  gpsd_host: 127.0.0.1
  gpsd_port: 2947
  device: ""                   # e.g. /dev/ttyACM0 (VK-162); empty = find a u-blox / GPS device; set in config.local.yaml
  max_age_s: 10                # a fix older than this is "no fix"
  track_every_s: 10            # one track point every 10 s while moving more than track_min_move_m
  track_min_move_m: 25
  track_idle_s: 60             # and at least one a minute when standing still

retention:
  identity_days: 90            # radio IDs, talkgroups and the events carrying them are deleted after this
  track_days: 0                # the receiver's own GPS track; 0 = keep
  keyup_days: 180              # key-ups seen by watch sessions (no identities in them); 0 = keep
                               # radios' own positions (LRRP) are never stored

power:
  state_file: ""               # JSON left by a power guard service (e.g. /run/dmr/power.json); set in config.local.yaml
  state_max_age_s: 120         # ignore the file when it is older than this
  battery_max_instances: 2     # DSD-FME instances when not on a confirmed full supply
  battery_watch_instances: 3   # in a watch session on battery: one pinned control channel + two traffic channels
  battery_session_s: 1200      # default session length on battery
  stop_on_undervoltage: true   # stop a running session when the firmware reports undervoltage now

correlator:
  interval_minutes: 30
  window_days: 30             # evidence collectors look back this far (mapper correlate --window-days)
  weights:                     # see DESIGN.md "Evidence"
    explicit_neighbor: 0.90
    explicit_lcn_freq: 0.95
    explicit_same_site: 0.70
    explicit_lcn_grant: 0.85    # Capacity Max: the grants a traffic channel repeats name its own LCN, which its control channel grants
    behavioral_rest_hop: 0.50
    behavioral_lsn_table: 0.60
    behavioral_lcn_keyup: 0.70  # Capacity Max: a channel update names the LCN of a carrier that keys up / carries the call
    identity_radio: 0.30
    identity_talkgroup: 0.15
    identity_slco: 0.20         # Tier II: the same undecoded SLCO content repeated on two carriers
    rf_profile: 0.10
    manual: 1.00
  decay_days:                  # e-folding time per evidence class; 0 = no decay
    explicit: 30
    behavioral: 14
    identity: 30
    rf: 7
    manual: 0
  labels:                      # lower bounds of each confidence label
    confirmed: 0.85
    probable: 0.60
    possible: 0.30
  tier2_max_confidence: 0.60   # links supported only by Tier II evidence never exceed this

archive:                       # the archive Pi PULLS paths.snapshots (deploy/archive-pull.sh, read-only key);
                               # this Pi never needs to know the archive's address
  snapshot_time: "03:30"       # local time of the nightly snapshot + export (systemd timer; runs at boot if missed)
  keep_local: 3                # snapshots kept on this Pi (SD card); the archive keeps its own history

mcp:                           # mapper serve-mcp: Claude Code on the laptop over Tailscale (Phase 5, DEPLOY.md §6)
  enabled: false               # deploy.sh installs and starts dmr-mapper-mcp.service only when true
  bind: 127.0.0.1              # set the Pi's Tailscale address (tailscale ip -4) in config.local.yaml; no token:
                               # anything but loopback or a Tailscale address is refused (unless allow_any_bind: true)
  port: 8765
  allowed_hosts: []            # other names the laptop may use for the Pi in the URL, e.g. its MagicDNS name
  approval: ask                # scans (survey, decode, watch) need your approval:
                               #   ask: a yes/no dialog in Claude Code; if the client cannot show one, as console
                               #   console: always y in `mapper tui` or `mapper approve` on the Pi
                               #   none: no approval here (Claude Code's own permission prompt is the only gate)
  approval_timeout_min: 10     # a request nobody approved by then expires
  default_session_minutes: 10  # budget of a session Claude asks for without giving one
  max_session_minutes: 30      # the most Claude may ask for
  max_proposal_confidence: 0.8 # the most a link proposed by Claude counts for (it never confirms a link by itself)
  show_radio_ids: false        # false: radio IDs reach Claude as pseudonyms (talkgroups are shown)
